name: Test and deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend tests
        run: python -m unittest backend.test_classrooms backend.test_app backend.test_data backend.test_logging

      - name: Validate deployment files
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          bash -n deploy/deploy.sh

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Deploy commit through restricted SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          APP_PORT: ${{ vars.EC2_HTTP_PORT || '80' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$EC2_HOST" "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" "$GITHUB_SHA"
          echo "배포 커밋 \`$GITHUB_SHA\` → http://$EC2_HOST:$APP_PORT/" >> "$GITHUB_STEP_SUMMARY"

      - name: Public smoke test
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_PORT: ${{ vars.EC2_HTTP_PORT || '80' }}
        run: |
          set -euo pipefail
          curl -fsS -m 15 "http://$EC2_HOST:$APP_PORT/api/health"
          curl -fsS -m 15 -o /dev/null "http://$EC2_HOST:$APP_PORT/"
